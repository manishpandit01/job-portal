{% load static %}
<!-- Jobs Start -->
        <div class="container-xxl py-5">
            <div class="container">
                <h1 class="text-center mb-5 wow fadeInUp" data-wow-delay="0.1s">Featured Jobs</h1>
                <div class="row g-4">

                        {% for job in featured_jobs %}
                    <div class="col-lg-4 col-md-6 wow fadeInUp" data-wow-delay="0.1s">
                        <div class="job-item p-4 border rounded h-100">
                            <div class="d-flex align-items-center mb-3">
                                <img class="flex-shrink-0 img-fluid border rounded" src="{{ job.logo.url }}" alt="" style="width: 60px; height: 60px; object-fit: cover;">
                                <div class="text-start ps-3 flex-grow-1">
                                    <h6 class="mb-1">{{job.company.name}}</h6>
                                    <small class="text-muted">{{job.company.location}}</small>
                                </div>
                            </div>
                            <h5 class="mb-2">{{job.title}}</h5>
                            <p class="text-muted small mb-3">{{job.description|truncatechars:50}}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="badge bg-info">{{job.job_type}}</span>
                                    <span class="badge bg-success">{{job.salary}}</span>
                                </div>
                                <a href="job-detail.html" class="btn btn-primary btn-sm">View</a>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                    
                </div>
                <div class="text-center mt-5">
                    <a href="job-list.html" class="btn btn-primary py-3 px-5">Browse All Jobs</a>
                </div>
            </div>
        </div>
        <!-- Jobs End -->
