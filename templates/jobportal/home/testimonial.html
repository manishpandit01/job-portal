 {% load static %}
 <!-- Testimonial Start -->
        <div class="container-xxl py-5 wow fadeInUp" data-wow-delay="0.1s">
            <div class="container">
                <h1 class="text-center mb-5">What Our Clients Say!!!</h1>
                {% for testimonial in testimonials %}
                <div class="row g-4">
                    <div class="col-md-6 col-lg-4 wow fadeInUp" data-wow-delay="0.2s">
                        <div class="testimonial-item bg-light rounded p-4 h-100">
                            <div class="d-flex align-items-center mb-3">
                                <i class="fa fa-quote-left fa-2x text-primary me-3"></i>
                                <div class="flex-grow-1">
                                    <h6 class="mb-0">{{testimonial.name}}</h6>
                                    <small class="text-muted">{{testimonial.profession}}</small>
                                </div>
                            </div>
                            <p class="mb-3">{{testimonial.message}}</p>
                            <div class="text-center">
                                <img class="" src="{{testimonial.image.url}}" alt="Mike Chen" style="width: 60px; height: 60px; object-fit: cover;">
                            </div>
                        </div>
                    </div> 
                </div>
                {% endfor %}
            </div>
        </div>
        <!-- Testimonial End -->
